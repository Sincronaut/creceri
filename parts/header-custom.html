<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Header with Responsive Logo</title>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    /* Design tokens */
    :root {
      --brand: #962E2A;
      --ink: #1f2328;
      --muted: #6b6f75;
      --rose-500: #962E2A;
      --rose-100: #F5E8E6;
      --card: #962E2A;
      --panel: #962E2A;
      --radius: 14px;
      --shadow: 0 6px 18px rgba(149, 46, 42, .08), 0 2px 6px rgba(17, 24, 39, .06);
      --rail-gap: 14px;

      --fs-h2: 32px;
      --fs-h3: 22px;
      --fs-body: 16px;

      --bg-start: #f6e3d6;
      --bg-end: #962E2A;
      --card-bg: #962E2A;
      --text: #1f2937;
      --accent: #c0392b;
      --gap: 24px;
      --topbar-h: 0px;
      --header-bg-scrolled: #962E2A;
      --hover-accent: #FFA318;

      /* =============================
         Responsive brand logo sizing
      ============================= */
      /* Desktop defaults */
      --logo-w: 180px;
      --logo-w-scrolled: 160px;
    }

    body {
      margin: 0;
      font: 500 16px/1.3 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Inter";
      padding-top: var(--header-h, 64px);
    }

    /* CTA */
    .btn-pill {
      min-width: clamp(160px, 28vw, 260px);
      width: auto !important;
      --c-start: #962E2A !important;
      --c-end: #FFA318 !important;
      text-decoration: none;
      background-image: linear-gradient(90deg, var(--c-start) 0 50%, var(--c-end) 50% 100%) !important;
      background-size: 200% 100% !important;
      background-position: left center !important;
      background-color: var(--c-start) !important;
      color: #fff !important;
      border: 0 !important;
      padding: .75rem 1.25rem !important;
      border-radius: 999px !important;
      cursor: pointer !important;
      transition: background-position .35s ease, color .35s ease, box-shadow .2s ease, transform .2s ease !important;
      font-size: 18px !important;
      font-weight: 650 !important;
    }

    .btn-pill:hover {
      background-position: right center !important;
      color: #000 !important;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .15) !important;
      transform: translateY(-1px) !important;
    }

    .btn-pill:focus-visible {
      outline: none !important;
      box-shadow: 0 0 0 3px rgba(255, 163, 24, .45), 0 6px 16px rgba(0, 0, 0, .15) !important;
    }

    @media (prefers-reduced-motion:reduce) {
      .btn-pill {
        transition: none !important;
      }
    }

    .btn-pill:active {
      transform: translateY(1px);
    }

    /* =============================
       Header (fixed)
    ============================= */
    .site-header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 1000;
      background: transparent;
      /* desktop default = transparent */
      border-bottom: 1px solid transparent;
      box-shadow: none;
      padding: 0 100px;
      font-size: 18px;
      color: var(--brand);
    }

    .site-header:not(.is-ready) {
      transition: none !important;
      box-shadow: none !important;
      border-bottom-color: transparent !important;
    }

    /* Desktop scroll flip */
    .site-header.is-scrolled {
      background: var(--header-bg-scrolled, #962E2A) !important;
      border-bottom-color: rgba(0, 0, 0, .06) !important;
      box-shadow: 0 8px 20px rgba(0, 0, 0, .15) !important;
      color: #fff;
    }

    /* Brand + nav colors when scrolled */
    .site-header.is-scrolled .brand-text,
    .site-header.is-scrolled .brand-square {
      color: #fff;
      background-color: #962E2A;
    }

    .site-header.is-scrolled .nav-link,
    .site-header.is-scrolled .nav-button {
      color: #fff;
      transition: color .3s ease, background-color .3s ease;
    }

    /* Active pill logic */
    .nav-link.active,
    .nav-button.is-active {
      background: var(--brand);
      color: #fff;
      border-radius: 10px;
      padding: 8px 16px;
    }

    .site-header.is-scrolled .nav-link.active,
    .site-header.is-scrolled .nav-button.is-active {
      background: #fff;
      color: var(--brand);
    }

    /* Hover in scrolled state */
    .site-header.is-scrolled .nav-link:hover,
    .site-header.is-scrolled .nav-button:hover {
      background: rgba(255, 255, 255, .15);
      color: #fff;
    }

    /* Optional hero variant keeps header transparent until scroll */
    body:has(.hero--bleed-top) .site-header {
      background: transparent;
      border-bottom-color: transparent;
      box-shadow: none;
      color: var(--brand);
    }

    body:has(.hero--bleed-top) .site-header.is-scrolled {
      background: var(--header-bg-scrolled, #962E2A) !important;
      color: #fff;
    }

    /* Layout */
    .header-inner {
      max-width: 1500px;
      margin: 0 auto;
      padding: 14px 20px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
    }

    /* Branding */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--brand);
      font-weight: 600;
    }

    .brand-square {
      width: 25px;
      height: 25px;
      flex: 0 0 25px;
      border-radius: 4px;
      background: var(--brand);
    }

    .brand-text {
      margin-left: 35px;
      font-weight: 600;
      color: var(--brand);
    }

    /* Responsive logo element */
    .brand-logo {
      display: block;
      width: var(--logo-w) !important;
      /* responsive width */
      height: auto;
      max-width: 100%;
      /* never overflow container */
      max-height: calc(var(--header-h, 64px) - 18px);
      /* fit within header */
      object-fit: contain;
    }

    .site-header.is-scrolled .brand-logo {
      width: var(--logo-w-scrolled) !important;
    }

    /* Nav */
    nav[aria-label="Main"] {
      grid-column: 3;
      justify-self: end;
    }

    .nav-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 28px;
      flex-wrap: nowrap;
    }

    .nav-link,
    .nav-button {
      text-decoration: none;
      color: var(--brand);
      font-weight: 520;
      padding: 8px 12px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
    }

    .nav-list>li {
      flex: none;
    }

    .dropdown {
      position: relative;
    }

    .nav-link:hover,
    .nav-button:hover {
      opacity: 1;
    }

    /* Focus */
    .nav-link:focus-visible,
    .submenu a:focus-visible {
      background: rgba(150, 46, 42, .12);
      color: var(--brand);
      outline: 2px solid rgba(138, 58, 51, .4);
      outline-offset: 2px;
    }

    .nav-button:focus-visible {
      outline: 2px solid rgba(138, 58, 51, .5);
      outline-offset: 2px;
    }

    /* Submenu */
    .caret {
      width: 10px;
      height: 10px;
      display: inline-block;
      transition: transform .2s ease;
    }

    .submenu {
      position: absolute;
      left: 0;
      top: 100%;
      min-width: 320px;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 8px;
      margin: 0;
      list-style: none;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .08);
      display: none;
      z-index: 1001;
    }

    .submenu a {
      display: block;
      padding: 10px 12px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--brand);
      position: relative;
    }

    /* Desktop open on hover/focus */
    @media (hover:hover) {

      .dropdown:hover>.submenu,
      .dropdown:focus-within>.submenu {
        display: block;
      }
    }

    /* Checkbox fallback (click) */
    .sub-toggle:checked+.nav-button+.submenu {
      display: block;
    }

    /* Accent underline */
    .nav-link::after,
    .nav-button::after,
    .submenu a::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 4px;
      height: 2px;
      background: var(--hover-accent);
      border-radius: 2px;
      transform: scaleX(0);
      transform-origin: left center;
      opacity: 0;
      transition: transform .25s ease, opacity .25s ease;
    }

    @media (hover:hover) {

      .nav-link:hover::after,
      .nav-button:hover::after,
      .submenu a:hover::after {
        transform: scaleX(1);
        opacity: 1;
      }
    }

    .nav-link:focus-visible::after,
    .nav-button:focus-visible::after,
    .submenu a:focus-visible::after {
      transform: scaleX(1);
      opacity: 1;
    }

    /* A11y resets */
    :where(a, button, .nav-link, .nav-button, .submenu a, .menu-toggle, .btn-pill):focus,
    :where(a, button, .nav-link, .nav-button, .submenu a, .menu-toggle, .btn-pill):active {
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
    }

    :where(a, button, .nav-link, .nav-button, .submenu a, .menu-toggle, .btn-pill):focus-visible {
      outline: 2px solid rgba(255, 163, 24, .60);
      outline-offset: 2px;
    }

    button::-moz-focus-inner {
      border: 0;
    }

    :where(a, button, .nav-link, .nav-button, .submenu a, .menu-toggle, .btn-pill) {
      -webkit-tap-highlight-color: transparent;
    }

    /* Burger */
    .menu-toggle {
      justify-self: end;
      display: none;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 10px;
      padding: 8px 10px;
      transition: background-color .2s ease, border-color .2s ease;
    }

    .menu-toggle:focus-visible {
      outline: 2px solid rgba(150, 46, 42, .6);
      outline-offset: 2px;
    }

    .icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Mobile / tablet */
    @media (max-width:1115px) {
      .site-header {
        padding: 0 50px !important;
        font-size: 15px;
      }

      .nav-list {
        gap: 10px !important;
      }

      /* Tablet logo tuning */
      :root {
        --logo-w: 160px;
        --logo-w-scrolled: 145px;
      }
    }

    @media (max-width:870px) {

      /* Lock white header on mobile; no scroll-driven changes */
      .site-header,
      .site-header.is-scrolled {
        background: #fff !important;
        border-bottom: 1px solid rgba(0, 0, 0, .06) !important;
        box-shadow: none !important;
        color: var(--brand) !important;
      }

      .header-inner {
        grid-template-columns: 1fr auto;
        grid-auto-rows: auto;
        transition: none !important;
        background: #fff !important;
        padding: 0 !important;
      }

      .site-header {
        padding-inline: 0 !important;
      }

      .menu-toggle {
        display: block;
        grid-column: 2;
        grid-row: 1;
        z-index: 2;
      }

      nav[aria-label="Main"] {
        grid-column: 1 / -1;
        grid-row: 2;
        width: 100%;
        display: none;
        margin: 0;
        padding: 0;
      }

      .site-header.is-open nav[aria-label="Main"] {
        display: block;
        border-top: 1px solid rgba(0, 0, 0, .06);
        box-shadow: 0 8px 20px rgba(0, 0, 0, .06);
        background: #fff !important;
        color: var(--brand) !important;
        margin: 0;
        padding: 0;
      }

      .nav-list {
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        padding: 0;
        width: 100%;
      }

      .nav-list>li {
        width: 100%;
      }

      .nav-link,
      .nav-button {
        width: 100%;
        padding: 12px 20px;
        color: var(--brand) !important;
        background: transparent !important;
      }

      /* Mobile active = white pill with maroon text */
      .site-header.is-open .nav-link.active,
      .site-header.is-open .nav-button.is-active {
        background: #fff !important;
        color: var(--brand) !important;
      }

      .dropdown .submenu {
        position: static;
        display: none;
        border: 0;
        box-shadow: none;
        padding: 0;
        margin: 0;
      }

      .sub-toggle:checked+.nav-button+.submenu {
        display: block;
      }

      .sub-toggle:checked+.nav-button .caret {
        transform: rotate(180deg);
      }

      .nav-button {
        width: 100%;
        justify-content: space-between;
      }

      /* Mobile logo tuning */
      :root {
        --logo-w: min(46vw, 170px);
        --logo-w-scrolled: var(--logo-w);
      }

      .brand-text {
        margin-left: 0;
      }
    }

    /* Motion nicety */
    @media (prefers-reduced-motion:no-preference) {
      .submenu {
        transition: opacity .15s ease, transform .15s ease;
        transform: translateY(4px);
      }

      .dropdown:hover>.submenu {
        opacity: 1;
        transform: none;
      }
    }

    /* Top utility (optional) */
    .top-utility {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1001;
      background: #f7f9fc;
      color: var(--ink);
      border-bottom: 1px solid rgba(0, 0, 0, .06);
      transform: translateY(-100%);
      opacity: 0;
      transition: transform .2s ease, opacity .2s ease;
    }

    .topbar-visible .top-utility {
      transform: translateY(0);
      opacity: 1;
    }

    .top-utility__inner {
      max-width: 1500px;
      margin: 0 auto;
      padding: 8px 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
    }

    .top-utility__left {
      display: flex;
      align-items: center;
      gap: 22px;
      font: 500 13px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #394150;
    }

    .top-utility__right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-utility__social a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #fff;
      border: 1px solid rgba(0, 0, 0, .06);
      color: #1877f2;
      text-decoration: none;
    }

    /* Active underline suppression */
    .nav-link.active::after,
    .nav-button.is-active::after,
    .submenu a.active::after {
      transform: scaleX(0) !important;
      opacity: 0 !important;
    }

    .width_menu {
      min-width: 320px;
    }

    .width_menu_lang {
      min-width: 180px;
    }
  </style>
</head>

<body>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <a class="brand" href="/home/">
        <span class="brand-text">
          <img class="brand-logo" src="/wp-content/themes/child-creceri-reyes/assets/images/creceri-logo.webp"
            data-logo-default="/wp-content/themes/child-creceri-reyes/assets/images/creceri-logo.webp"
            data-logo-scrolled="/wp-content/themes/child-creceri-reyes/assets/images/creceri-logo-2.webp"
            loading="eager" decoding="async" fetchpriority="high" alt="Creceri" />
        </span>
      </a>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu">
        <span class="sr-only">Menu</span>
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z" />
        </svg>
      </button>

      <nav id="main-menu" aria-label="Main">
        <ul class="nav-list">
          <li><a class="nav-link" href="/home/">Home</a></li>
          <li><a class="nav-link" href="/about/">About</a></li>

          <li class="dropdown">
            <input class="sub-toggle" id="g-and-i" type="checkbox" hidden />
            <label class="nav-button" for="g-and-i">
              Guides &amp; Insights
              <svg class="caret" viewBox="0 0 10 10" aria-hidden="true">
                <path d="M0 3h10L5 8z" fill="currentColor" />
              </svg>
            </label>
            <ul class="submenu width_menu">
              <li><a href="/ecommerce-development/">E-commerce Development</a></li>
              <li><a href="/website-cms-development/">Website & CMS Development</a></li>
              <li><a href="/ui-ux-design/">UX/UI & App Design</a></li>
              <li><a href="/digital-marketing/">Digital Marketing</a></li>
              <li><a href="/team-extension/">Staffing & Team Extension</a></li>
            </ul>
          </li>

          <li><a class="nav-link" href="/stories/">Tek Stories</a></li>
          <li><a class="nav-link" href="/whats-new/">What's New</a></li>
          <li><a class="nav-link" href="/contact-us/">Inquire Now</a></li>

          <li class="dropdown nav-lang">
            <input class="sub-toggle" id="lang" type="checkbox" hidden />
            <label class="nav-button" for="lang">
              🌐 Language
              <svg class="caret" viewBox="0 0 10 10" aria-hidden="true">
                <path d="M0 3h10L5 8z" fill="currentColor" />
              </svg>
            </label>
            <ul class="submenu lang-menu width_menu_lang">
              <li><a href="#" data-lang="en"><img
                    src="/wp-content/themes/child-creceri-reyes/images-content/Animated-Flag-USA.gif" style="width:25px;"
                    alt="English flag" /> English</a></li>
              <li><a href="#" data-lang="ko"><img
                    src="/wp-content/themes/child-creceri-reyes/images-content/Animated-Flag-South-Korea.gif"
                    style="width:25px;" alt="Korean flag" /> 한국어</a></li>
            </ul>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <script>
    (function () {
      const header = document.querySelector('.site-header');
      if (!header) return;

      const burger = header.querySelector('.menu-toggle');
      const brandImg = header.querySelector('.brand-logo');
      const langToggle = header.querySelector('#lang');
      const langLinks = header.querySelectorAll('.lang-menu [data-lang]');

      /* --- Helpers --- */
      function setHeaderHeight() {
        const h = header.getBoundingClientRect().height || 64;
        document.documentElement.style.setProperty('--header-h', h + 'px');
      }

      function onScroll() {
        const isMobile = window.matchMedia('(max-width: 870px)').matches; // mobile cutoff
        if (isMobile) {
          header.classList.remove('is-scrolled');
          if (brandImg) {
            const def = brandImg.getAttribute('data-logo-default');
            if (def && brandImg.src !== def) brandImg.src = def;
          }
          return;
        }
        const scrolled = window.scrollY > 2;
        header.classList.toggle('is-scrolled', scrolled);

        if (brandImg) {
          const target = scrolled ? brandImg.getAttribute('data-logo-scrolled')
            : brandImg.getAttribute('data-logo-default');
          if (target && brandImg.src !== target) brandImg.src = target;
        }
      }

      function onToggle() {
        const open = !header.classList.contains('is-open');
        header.classList.toggle('is-open', open);
        if (burger) burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      // Language helpers (optional prefix-based routing)
      const DEFAULT_LANG = 'en';
      const NON_DEFAULTS = ['ko'];
      function stripLangPrefix(pathname) {
        const re = new RegExp('^/(?:' + NON_DEFAULTS.join('|') + ')(?=/|$)', 'i');
        const stripped = (pathname || '/').replace(re, '');
        return stripped || '/';
      }
      function buildTargetUrl(lang) {
        const pathNoLang = stripLangPrefix(location.pathname);
        let newPath = (lang === DEFAULT_LANG) ? pathNoLang : ('/' + lang + (pathNoLang === '/' ? '/' : pathNoLang));
        newPath = newPath.replace(/\/{2,}/g, '/');
        return location.origin + newPath + location.search + location.hash;
      }

      // Active-state logic: supports /, /home, and parent sections
      function normalizePath(pathname) {
        return stripLangPrefix((pathname || '/').toLowerCase())
          .replace(/\/{2,}/g, '/').replace(/\/+$/, '') || '/';
      }
      function isRootAlias(p) { return p === '/' || p === '/home'; }
      function pathMatches(linkPath, currentPath) {
        if (isRootAlias(linkPath) && isRootAlias(currentPath)) return true;
        if (linkPath === currentPath) return true;
        if (linkPath !== '/' && currentPath.startsWith(linkPath + '/')) return true;
        return false;
      }
      function syncActive() {
        const here = normalizePath(location.pathname);
        const links = header.querySelectorAll('.nav-list a[href]');
        let active = null;

        links.forEach(a => {
          const raw = a.getAttribute('href');
          if (!raw || /^#|mailto:|tel:/i.test(raw)) return a.classList.remove('active');
          let linkPath;
          try {
            const u = new URL(raw, location.origin);
            if (u.origin !== location.origin) return a.classList.remove('active');
            linkPath = normalizePath(u.pathname);
          } catch { return a.classList.remove('active'); }

          if (pathMatches(linkPath, here)) { a.classList.add('active'); active = a; }
          else a.classList.remove('active');
        });

        header.querySelectorAll('.nav-button').forEach(b => b.classList.remove('is-active'));
        if (active) {
          const dd = active.closest('.dropdown');
          const trigger = dd && dd.querySelector('.nav-button');
          if (trigger) trigger.classList.add('is-active');
        }
      }

      /* --- Wire-up --- */
      window.addEventListener('load', () => { setHeaderHeight(); onScroll(); syncActive(); });
      window.addEventListener('resize', () => { setHeaderHeight(); onScroll(); });
      window.addEventListener('orientationchange', () => { setHeaderHeight(); onScroll(); });
      window.addEventListener('scroll', onScroll, { passive: true });
      if (burger) burger.addEventListener('click', onToggle);

      if (langLinks.length) {
        langLinks.forEach(a => {
          a.addEventListener('click', (e) => {
            e.preventDefault();
            const lang = (a.dataset.lang || '').toLowerCase();
            if (!lang) return;
            try { document.cookie = 'site_lang=' + lang + '; Max-Age=31536000; path=/'; } catch { }
            if (langToggle) langToggle.checked = false; // close dropdown
            location.assign(buildTargetUrl(lang));
          });
        });
      }

      // Bootstrap
      setHeaderHeight();
      onScroll();
      syncActive();
      requestAnimationFrame(() => header.classList.add('is-ready'));
    })();
