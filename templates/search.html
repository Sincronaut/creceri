<body style="background:
      radial-gradient(1200px 320px at 65% -120px, #f7efee 0%, rgba(247,239,238,0) 55%),
      linear-gradient(90deg, var(--bg-left), var(--bg-right));">


  <!-- wp:group {"tagName":"main","className":"alignfull"} -->
  <style>
    :root {
      --accent: #962E2A;
    }

    .blog-filters {
      max-width: 880px;
      margin: 40px auto 0;
      padding: 50px 100px 20px;
    }

    .search-form {
      margin: 0;
    }

    /* pill container */
    .search-pill {
      position: relative;
      width: 100%;
      border: 1px solid var(--accent);
      border-radius: 9999px;
      background: linear-gradient(180deg, #ffffff 0%, #f4f4f4 100%);
      box-shadow: 0 0 0 1px rgba(138, 58, 51, .15) inset, 0 2px 10px rgba(0, 0, 0, .06);
    }

    .search-input {
      width: 100%;
      height: 48px;
      line-height: 48px;
      padding: 0 56px 0 16px;
      /* room for icon button */
      border: 0;
      background: transparent;
      border-radius: 9999px;
      box-sizing: border-box;
      font-size: 16px;
      color: #3a2a28;
      outline: none;
    }

    .search-input::placeholder {
      color: #a79b98;
    }

    .search-input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
    }

    /* icon button */
    .search-btn {
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border: 1px solid var(--accent);
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }

    .search-btn:hover {
      background: #fdf7f6;
    }

    .search-btn svg {
      width: 18px;
      height: 18px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2;
    }

    /* focus ring on container */
    .search-pill:focus-within {
      box-shadow: 0 0 0 2px rgba(138, 58, 51, .25), 0 2px 10px rgba(0, 0, 0, .06);
    }

    /* responsive */
    @media (max-width:769px) {
      .blog-filters {
        padding: 30px 20px 20px;
      }
    }

    @media (max-width:609px) {
      .blog-filters {
        padding: 20px;
      }
    }

    /* a11y helper (visually hidden label) */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 1, 1);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <main class="wp-block-group alignfull">
    <!-- wp:html -->
    <section class="blog-filters">
      <form class="search-form" method="get" action="">
        <label for="site-search" class="sr-only">Search</label>
        <div class="search-pill">
          <input id="site-search" class="search-input" type="search" name="s" placeholder="Search" aria-label="Search"
            autocomplete="off" />
          <button class="search-btn" type="submit" aria-label="Submit search">
            <!-- magnifying glass icon -->
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6"></circle>
              <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
            </svg>
          </button>
        </div>
      </form>

      <!-- keep input synced with ?s= for WP pages that can’t run PHP -->
      <script>
        (function () {
          var params = new URLSearchParams(window.location.search);
          var s = params.get('s') || '';
          var input = document.getElementById('site-search');
          if (input) input.value = s;
        }());
      </script>
    </section>
    <!-- /wp:html -->
